name: tests

on:
  push:
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # the official BLAKE3 vectors, plus the subtree properties the peergos plan needs
      - run: node test/node.mjs

  b3sum-agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # an independent check: the hash we compute is what the reference binary prints,
      # including a file rebuilt from merged 4MiB subtree chaining values
      - run: cargo install b3sum --locked
      - run: node test/b3sum.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the tests have to pass in a browser too: that is where this code will run
      - run: python3 tools/browser.py firefox test 300
      # and the wasm build must agree with the js one, vectors and subtree calls alike
      - run: python3 tools/browser.py firefox wasm 300

  generated-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # src/blake3-fast.js is generated: regenerating must produce exactly what is
      # committed, or the generator and the file have drifted
      - run: python3 tools/gen-fast.py
      - run: git diff --exit-code src/blake3-fast.js || { echo "run tools/gen-fast.py and commit the result"; exit 1; }

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the committed .wasm files must be reproducible from the crate, and the
      # wasm32_simd feature must stay on: without it the build is 3x slower
      - run: rustup target add wasm32-unknown-unknown
      - working-directory: wasm
        run: RUSTFLAGS="-C target-feature=+simd128" cargo build --release --target wasm32-unknown-unknown
      - working-directory: wasm
        run: |
          cmp target/wasm32-unknown-unknown/release/blake3_wasm.wasm \
              ../bench/wasm/blake3-simdfeature.wasm \
            || { echo "committed wasm differs from a fresh build: rebuild and commit it"; exit 1; }
