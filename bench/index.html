<!doctype html>
<meta charset="utf-8">
<title>BLAKE3 vs WebCrypto benchmark</title>
<body style="font: 14px monospace; padding: 16px; max-width: 900px">
<h1>BLAKE3 vs WebCrypto benchmark</h1>
<p>Target: <b>≥742 MiB/s</b>, parity with WebCrypto SHA-256.</p>
<pre id="out">running…</pre>
<script type="module">
const MiB = 1024 * 1024;
const out = document.getElementById("out");
const log = [];
const say = (line) => {
    log.push(line);
    out.textContent = log.join("\n");
};

/** Run one mode in `workers` parallel workers, each hashing its own buffer. */
function measure(mode, sizeBytes, runs, warmup, workers) {
    return new Promise((resolve, reject) => {
        const all = [];
        const loops = [];
        let done = 0;
        for (let w = 0; w < workers; w++) {
            const worker = new Worker("./worker.js", { type: "module" });
            worker.onerror = (e) => reject(new Error(mode + ": " + (e.message || "worker error")));
            worker.onmessage = (e) => {
                all.push(...e.data.times);
                loops.push(e.data.loopMs);
                worker.terminate();
                if (++done === workers) {
                    // the slowest worker's hashing loop: what a parallel upload waits for,
                    // without counting worker startup or module compilation
                    const wall = Math.max(...loops);
                    all.sort((a, b) => a - b);
                    resolve({
                        mode, workers,
                        sizeMiB: sizeBytes / MiB,
                        medianMs: all[Math.floor(all.length / 2)],
                        bestMs: all[0],
                        // per worker rate, from that worker's own timings
                        perWorkerMiBs: (sizeBytes / MiB) / (all[Math.floor(all.length / 2)] / 1000),
                        // what an upload actually gets: all bytes hashed / wall clock
                        aggregateMiBs: (workers * runs * sizeBytes / MiB) / (wall / 1000),
                    });
                }
            };
            worker.postMessage({ mode, sizeBytes, runs, warmup, seed: 12345 + w });
        }
    });
}

const cores = navigator.hardwareConcurrency || 4;
const results = { userAgent: navigator.userAgent, cores, rows: [] };
const row = (r) => {
    results.rows.push(r);
    say(("  " + r.mode).padEnd(24) + String(r.sizeMiB).padStart(3) + " MiB  "
        + ("x" + r.workers).padStart(4) + "  median " + r.medianMs.toFixed(1).padStart(7)
        + " ms   per-worker " + r.perWorkerMiBs.toFixed(0).padStart(5)
        + " MiB/s   aggregate " + r.aggregateMiBs.toFixed(0).padStart(5) + " MiB/s");
};

try {
    say("cores reported: " + cores);
    say("");
    say("baseline (what we have to match), at the same 4 MiB the blake3 rows use:");
    row(await measure("sha256", 4 * MiB, 20, 3, 1));
    row(await measure("sha512", 4 * MiB, 20, 3, 1));
    say("  and at 5 MiB, the legacy chunk size, to show size does not change the rate:");
    row(await measure("sha256", 5 * MiB, 20, 3, 1));
    row(await measure("sha512", 5 * MiB, 20, 3, 1));
    say("");
    say("pure JS blake3, the real workload (4 MiB subtree chaining value):");
    row(await measure("blake3-subtree", 4 * MiB, 10, 2, 1));
    row(await measure("blake3-fast", 4 * MiB, 20, 3, 1));
    row(await measure("blake3-fast-small", 4 * MiB, 20, 3, 1));
    say("");
    say("same size as the baseline, for a like-for-like rate:");
    row(await measure("blake3-oneshot", 5 * MiB, 10, 2, 1));
    say("");
    say("reference crate compiled to wasm32, copy into linear memory included:");
    row(await measure("wasm-scalar-copy", 4 * MiB, 20, 3, 1));
    row(await measure("wasm-simd128-copy", 4 * MiB, 20, 3, 1));
    row(await measure("wasm-simdfeature-copy", 4 * MiB, 20, 3, 1));
    say("");
    say("the same, kernel only, and the copy on its own - the copy is wasm's tax:");
    row(await measure("wasm-simd128-nocopy", 4 * MiB, 20, 3, 1));
    row(await measure("wasm-simd128-copyonly", 4 * MiB, 20, 3, 1));
    say("");
    say("parallel, which is how an upload hashes chunks anyway:");
    for (const n of [2, 4, cores])
        row(await measure("blake3-fast", 4 * MiB, 8, 2, n));
    say("");
    for (const n of [2, 4, cores])
        row(await measure("wasm-simdfeature-copy", 4 * MiB, 10, 2, n));
    say("");
    say("sha256 in parallel, for the same comparison:");
    for (const n of [2, 4, cores])
        row(await measure("sha256", 4 * MiB, 20, 3, n));

    const wasmBest = results.rows.filter(r => r.mode.startsWith("wasm-") && r.mode.endsWith("-copy") && r.workers === 1)
        .sort((a, b) => b.perWorkerMiBs - a.perWorkerMiBs)[0];
    const fastRow = results.rows.find(r => r.mode === "blake3-fast" && r.workers === 1);
    const b3 = results.rows.find(r => r.mode === "blake3-subtree" && r.workers === 1);
    const sha = results.rows.find(r => r.mode === "sha256" && r.workers === 1 && r.sizeMiB === 4);
    results.verdict = {
        targetMiBs: 742,
        blake3SingleMiBs: b3.perWorkerMiBs,
        sha256SingleMiBs: sha.perWorkerMiBs,
        blake3BestAggregateMiBs: Math.max(...results.rows
            .filter(r => r.mode === "blake3-subtree").map(r => r.aggregateMiBs)),
        meetsTargetSingleThread: b3.perWorkerMiBs >= 742,
        wasmSingleMiBs: wasmBest ? wasmBest.perWorkerMiBs : null,
        wasmMode: wasmBest ? wasmBest.mode : null,
        wasmMeetsTargetSingleThread: wasmBest ? wasmBest.perWorkerMiBs >= 742 : null,
        fastJsSingleMiBs: fastRow ? fastRow.perWorkerMiBs : null,
        fastJsMeetsTargetSingleThread: fastRow ? fastRow.perWorkerMiBs >= 742 : null,
        fastJsBestAggregateMiBs: Math.max(...results.rows
            .filter(r => r.mode === "blake3-fast").map(r => r.aggregateMiBs)),
    };
    say("");
    say("single thread: blake3 " + b3.perWorkerMiBs.toFixed(0) + " MiB/s vs sha256 "
        + sha.perWorkerMiBs.toFixed(0) + " MiB/s, ratio "
        + (b3.perWorkerMiBs / sha.perWorkerMiBs).toFixed(2) + "x");
    say("target met single threaded, readable js: " + (results.verdict.meetsTargetSingleThread ? "yes" : "NO"));
    if (fastRow)
        say("target met single threaded, optimised js: "
            + (results.verdict.fastJsMeetsTargetSingleThread ? "yes" : "NO")
            + " at " + fastRow.perWorkerMiBs.toFixed(0) + " MiB/s, "
            + (fastRow.perWorkerMiBs / sha.perWorkerMiBs).toFixed(2) + "x sha256, "
            + (fastRow.perWorkerMiBs / b3.perWorkerMiBs).toFixed(2) + "x the readable one");
    if (wasmBest)
        say("target met single threaded, wasm (" + wasmBest.mode + "): "
            + (results.verdict.wasmMeetsTargetSingleThread ? "yes" : "NO")
            + " at " + wasmBest.perWorkerMiBs.toFixed(0) + " MiB/s, "
            + (wasmBest.perWorkerMiBs / sha.perWorkerMiBs).toFixed(2) + "x sha256");
    window.__results = results;
} catch (e) {
    say("ERROR " + (e && e.stack || e));
    results.error = String(e);
    window.__results = results;
}
</script>
</body>
